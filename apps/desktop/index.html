<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Zaylo</title>
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('zaylo_theme_preference') || localStorage.getItem('zaylo_theme');
          var theme = 'dark';
          if (pref === 'light') theme = 'light';
          else if (pref === 'dark') theme = 'dark';
          else if (pref === 'system' || !pref) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0c0d0e] text-zinc-100 antialiased select-none font-sans overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
